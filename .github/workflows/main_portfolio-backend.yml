name: Build and deploy Python app to Azure Web App - portfolio-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Remove venv before deploy
        run: |
          rm -rf server/portfolio_server/venv
          rm -rf server/portfolio_server/antenv
          du -sh server/portfolio_server/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B918917145BC4F51B2846B919ED5A95C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_7DAECB7AF83E40709ECA723B9C30832B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A8F28C4C6F24415CA9620BDACE09DD5C }}

      - name: Zip and deploy using Azure CLI
        run: |
          cd server/portfolio_server
          zip -r ../../deploy.zip . -x "venv/*" -x "antenv/*" -x "*.pyc" -x "__pycache__/*"
          cd ../..
          az webapp deploy \
            --resource-group myapp-rg \
            --name portfolio-backend \
            --src-path deploy.zip \
            --type zip